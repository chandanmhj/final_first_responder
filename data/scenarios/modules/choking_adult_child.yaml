id: choking_adult_child
title: 'Choking: adult and child (awake)'
handbook_pages: p.31-32
note: null
steps:
- id: choking_adult_child.01
  n: 1
  text: A person clutching their throat, unable to talk, cough or breathe, panicking or flailing is choking. Introduce
    yourself and reassure them.
  roles:
  - B
  - R
  source: handbook
  page: 31-32
- id: choking_adult_child.02
  n: 2
  text: If they can cough, encourage a forceful cough and let them lean forward.
  roles:
  - B
  - R
  source: handbook
  page: '32'
- id: choking_adult_child.03
  n: 3
  text: 'Help with back slaps: stand to one side, bend them forward, support the chest with one hand and give firm
    slaps between the shoulder blades.'
  roles:
  - B
  - R
  source: handbook
  page: '32'
  not_worked:
    label: Still choking
    hint: Move to abdominal thrusts.
- id: choking_adult_child.04
  n: 4
  text: If coughing does not clear it, or they cannot cough, give 5 abdominal thrusts (Heimlich).
  roles:
  - B
  - R
  source: handbook
  page: '32'
  tags:
  - abdominal_thrust
- id: choking_adult_child.05
  n: 5
  text: 'Heimlich: stand behind them with one leg between theirs and your arms around the waist. Make a fist with
    the thumb side against the belly, midway between the belly button and the lower end of the breastbone. Cover
    it with your other hand and pull sharply inward and upward.'
  roles:
  - B
  - R
  source: handbook
  page: '32'
  tags:
  - abdominal_thrust
  not_worked:
    label: Still choking
    hint: Alternate 5 abdominal thrusts with 5 back slaps.
- id: choking_adult_child.06
  n: 6
  text: Alternate 5 abdominal thrusts with 5 back slaps until it comes out or they become unresponsive.
  roles:
  - B
  - R
  source: handbook
  page: '32'
- id: choking_adult_child.07
  n: 7
  text: 'If they become unresponsive: call for help, ask for an AED, and start chest compressions at once.'
  roles:
  - B
  - R
  source: handbook
  page: '32'
  tags:
  - escalate_cpr
