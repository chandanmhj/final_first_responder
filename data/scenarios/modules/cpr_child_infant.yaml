id: cpr_child_infant
title: 'CPR: child and infant'
handbook_pages: p.24, p.27
note: null
steps:
- id: cpr_child_infant.01
  n: 1
  text: Start chest compressions straight away if a child or baby is unresponsive and not breathing. Get someone
    to call 108.
  roles:
  - B
  - R
  source: adapted
  page: '27'
  tags:
  - cpr
- id: cpr_child_infant.02
  n: 2
  text: Press on the lower half of the breastbone, one-third of the chest depth. Avoid the sharp lower tip of the
    breastbone.
  roles:
  - B
  - R
  source: handbook
  page: '27'
- id: cpr_child_infant.03
  n: 3
  text: 'Child: one hand may be enough. If one hand reaches one-third depth, use the other hand to gently tilt the
    head up to keep the airway open. Go at about 120 a minute.'
  roles:
  - B
  - R
  source: handbook
  page: '24'
- id: cpr_child_infant.04
  n: 4
  text: 'Baby: use two fingers of one hand if you are alone, or the two-thumb technique with your fingers around
    the chest, which is less tiring and more effective.'
  roles:
  - B
  - R
  source: handbook
  page: '27'
- id: cpr_child_infant.05
  n: 5
  text: Press at about 120 compressions a minute for babies.
  roles:
  - B
  - R
  source: handbook
  page: 27,35
- id: cpr_child_infant.06
  n: 6
  text: 'Baby pulse: feel on the inner side of the upper arm, just above the elbow. A heart rate under 60 a minute
    in a small child or baby needs compressions.'
  roles:
  - R
  source: handbook
  page: '27'
- id: cpr_child_infant.07
  n: 7
  text: If you are trained and no pulse is felt after the first compressions, consider rescue breaths.
  roles:
  - R
  source: handbook
  page: '27'
  tags:
  - rescue_breaths
