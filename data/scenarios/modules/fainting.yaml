id: fainting
title: Feeling faint or fainting
handbook_pages: IFRC p.401
note: null
steps:
- id: fainting.01
  n: 1
  text: Help them sit or lie down somewhere safe where they cannot fall.
  self_text: Sit or lie down right away somewhere you cannot fall.
  roles:
  - B
  - S
  - R
  source: ifrc
  page: '401'
- id: fainting.02
  n: 2
  text: Ask them to squat, or to cross their legs and tense the leg and buttock muscles. If they are lying down,
    you can raise their legs.
  self_text: Cross your legs and tense the leg and buttock muscles, or squat, until the feeling passes.
  roles:
  - B
  - S
  - R
  source: ifrc
  page: '401'
- id: fainting.03
  n: 3
  text: Reassure them and watch their breathing and responsiveness. Ask why they might feel faint, for example hunger
    or tiredness.
  roles:
  - B
  - R
  source: ifrc
  page: '401'
- id: fainting.04
  n: 4
  text: If there is chest pain or a racing heartbeat, call 108.
  roles:
  - B
  - S
  - R
  source: ifrc
  page: '401'
- id: fainting.05
  n: 5
  text: When they have recovered and can swallow, offer water. They should get up slowly.
  roles:
  - B
  - S
  - R
  source: ifrc
  page: '401'
  tags:
  - oral_intake
- id: fainting.06
  n: 6
  text: If they fell, check for injuries. If they stay unresponsive, check breathing and treat as unresponsive.
  roles:
  - B
  - R
  source: ifrc
  page: '401'
