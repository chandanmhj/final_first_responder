id: poisoning
title: Poisoning
handbook_pages: IFRC p.346
note: null
steps:
- id: poisoning.01
  n: 1
  text: Stop or reduce further contact with the poison. If it is toxic gas, move the person to fresh air only if
    it is safe for you.
  roles:
  - B
  - R
  source: ifrc
  page: '346'
- id: poisoning.02
  n: 2
  text: Find out what the substance is, how much, and when. Only touch the packaging if it is safe.
  roles:
  - B
  - R
  source: ifrc
  page: '346'
- id: poisoning.03
  n: 3
  text: Call 108 or a poison control centre. Tell them everything you know and follow their instructions.
  roles:
  - B
  - R
  source: ifrc
  page: '346'
- id: poisoning.04
  n: 4
  text: If possible, help them lie on their left side. Watch their breathing and how responsive they are.
  roles:
  - B
  - R
  source: ifrc
  page: '346'
  tags:
  - recovery_position
- id: poisoning.05
  n: 5
  text: Keep any bottles, packets or labels to give to the ambulance team.
  roles:
  - B
  - R
  source: ifrc
  page: '346'
- id: poisoning.06
  n: 6
  text: If they vomit while lying down, turn them on their side so they do not choke.
  roles:
  - B
  - R
  source: ifrc
  page: '346'
- id: poisoning.07
  n: 7
  text: Wear gloves or a mask if a harmful substance is suspected. If a harmful substance is around the mouth, use
    chest compressions only if CPR is needed.
  roles:
  - B
  - R
  source: ifrc
  page: 346-347
