services:
  - type: web
    name: first-responder-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - {key: ENV, value: production}
      - {key: ALLOWED_ORIGINS, sync: false}
      - {key: SUPABASE_URL, sync: false}
      - {key: SUPABASE_ANON_KEY, sync: false}
      - {key: SUPABASE_SERVICE_ROLE_KEY, sync: false}
      - {key: GROQ_API_KEY, sync: false}
      - {key: MEDIA_BASE_URL, sync: false}
      - {key: RETRIEVER, value: supabase}
